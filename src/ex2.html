<!doctype html>
<html lang="ko-KR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ex2</title>
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"/>
		<link rel="stylesheet" href="./css/ex2.css">
	</head>
	<body>
		
		<div class="cart_wrap">
			<h3 class="cart_header">
				<img src="/src/assets/images/ex2/cart.svg" alt="장바구니" />
				<span>장바구니</span>
			</h3>

			<ul class="cart_list">
				<li>
					<img class="item_image" src="/src/assets/images/ex2/product-01.png" alt="우유" />
					<div class="item_info">
						<div class="item_name">1A 우유 900ml</div>
						<div class="item_price">1,870 원</div>
					</div>
					<div class="item_count_chk">
						<button type="button" data-cnt-type="plus">+</button>
						<span class="count">2</span>
						<button type="button" data-cnt-type="minus">-</button>
					</div>
				</li>

				<li>
					<img class="item_image" src="/src/assets/images/ex2/product-02.png" alt="콩나물" />
					<div class="item_info">
						<div class="item_name">맛있는 콩나물 500g</div>
						<div class="item_price">1,280 원</div>
					</div>
					<div class="item_count_chk">
						<button type="button" data-cnt-type="plus">+</button>
						<span class="count">2</span>
						<button type="button" data-cnt-type="minus">-</button>
					</div>
				</li>

				<li>
					<img class="item_image" src="/src/assets/images/ex2/product-03.png" alt="두부부" />
					<div class="item_info">
						<div class="item_name">고소한 두부 1kg</div>
						<div class="item_price">2,210 원</div>
					</div>
					<div class="item_count_chk">
						<button type="button" data-cnt-type="plus">+</button>
						<span class="count">1</span>
						<button type="button" data-cnt-type="minus">-</button>
					</div>
				</li>
			</ul>

			<div class="cart_total_price">구매 총액 : 8,900원</div>
		</div>

	</body>
</html>
